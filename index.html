<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Catalog & Project Type</title>
  <!-- FontAwesome Icons for Zoom Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    
    h2 {
      color: #8B4513;
      text-transform: uppercase;
      font-size: 18px;
      margin-bottom: 10px;
    }

    .catalog-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .catalog-header span {
      font-size: 13px;
      color: #666;
      font-weight: bold;
    }

    /* Horizontal Scroll Catalog Container */
    .catalog-container {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding-bottom: 15px;
      scroll-behavior: smooth;
    }

    .catalog-container::-webkit-scrollbar {
      height: 8px;
    }

    .catalog-container::-webkit-scrollbar-thumb {
      background: #b5651d;
      border-radius: 4px;
    }

    /* Gallery Card Styling */
    .gallery-card {
      min-width: 180px;
      width: 180px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .img-box {
      position: relative;
      width: 100%;
      height: 120px;
      cursor: pointer;
      background: #eee;
    }

    .img-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .zoom-hint {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .title {
      padding: 10px;
      font-size: 13px;
      font-weight: bold;
      color: #b5651d;
      text-align: center;
      cursor: pointer;
      background: #fff;
      border-top: 1px solid #eee;
    }

    .title:hover {
      background: #f9f9f9;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="catalog-header">
    <h2>Select Design Catalog</h2>
    <span>(Click photo to view full size)</span>
  </div>

  <!-- Horizontal Design Catalog -->
  <div class="catalog-container">
    
    <!-- Card 1: Custom Design -->
    <div class="gallery-card">
      <div class="img-box" onclick="openFullImage('https://i.ibb.co/6y4g8h3/cub.jpg', 'My Custom Design')">
        <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
        <img src="https://i.ibb.co/6y4g8h3/cub.jpg" alt="Custom Design">
      </div>
      <div class="title" onclick="applyPreset('custom', 7.5, 9.0, 1.5, 6, 6, 2, 4, 'My Custom Design');">My Design (Select)</div>
    </div>

    <!-- Card 2: Standard Design -->
    <div class="gallery-card">
      <div class="img-box" onclick="openFullImage('https://images.unsplash.com/photo-1595515106969-1ce29566ff1c', 'Standard Design')">
        <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
        <img src="https://images.unsplash.com/photo-1595515106969-1ce29566ff1c" alt="Standard Design">
      </div>
      <div class="title" onclick="applyPreset('standard', 6.0, 8.0, 1.2, 5, 5, 2, 3, 'Standard Design');">Standard (Select)</div>
    </div>

    <!-- Card 3: Kitchen Design -->
    <div class="gallery-card">
      <div class="img-box" onclick="openFullImage('https://images.unsplash.com/photo-1556911220-e15b29be8c8f', 'Kitchen Unit')">
        <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
        <img src="https://images.unsplash.com/photo-1556911220-e15b29be8c8f" alt="Kitchen Design">
      </div>
      <div class="title" onclick="applyPreset('kitchen', 10.0, 12.0, 2.0, 8, 8, 4, 6, 'Kitchen Unit');">Kitchen (Select)</div>
    </div>

    <!-- Card 4: TV Unit Design -->
    <div class="gallery-card">
      <div class="img-box" onclick="openFullImage('https://images.unsplash.com/photo-1600585154340-be6161a56a0c', 'TV Unit')">
        <div class="zoom-hint"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
        <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c" alt="TV Unit">
      </div>
      <div class="title" onclick="applyPreset('tvunit', 8.0, 7.0, 1.0, 4, 4, 2, 2, 'TV Unit');">TV Unit (Select)</div>
    </div>

  </div>

  <script>
    function openFullImage(url, title) {
      // Yahan aap apni lightbox ya full image popup function laga sakte hain
      window.open(url, '_blank');
    }

    function applyPreset(type, w, h, d, p1, p2, p3, p4, name) {
      console.log("Selected Preset:", name);
      alert(name + " selected successfully!");
    }
  </script>

</body>
</html>
